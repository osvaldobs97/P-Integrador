<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="icon" type="image/x-icon" href="./assets/logoSinLetras.ico">
</head>

<body class="d-flex flex-column min-vh-100">

    <header id="navBar"></header>

    <main class="container flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="row py-4 justify-content-center w-100">
            <div class="col-md-5 col-lg-4">
                <div class="p-4 rounded custom-form-bg">

                    <h2 class="text-center mb-4">Login</h2>
                    <div class="alert alert-danger fade show" style="display:none;" role="alert" id="alertLogin">
                        <p id="alertTextoLogin" class="mb-0"></p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="correo@example.com">
                            <div id="error-username" class="error-message"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Ejemplo1!">
                            <div id="error-password" class="error-message"></div>
                        </div>

                        <button type="submit" id="btnAcceder" class="btn btn-primary w-100">Acceder</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-2">¿No tienes cuenta?</p>

                        <a href="./registro.html" class="btn btn-outline-secondary w-100">Crea una</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!--CARRITO -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasCarritoLabel">Tu carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">
            <div id="carritoItems" class="d-flex flex-column gap-3"></div>
        </div>

        <div class="p-3 border-top">
            <div class="d-flex justify-content-between mb-2">
                <span class="fw-bold">Total:</span>
                <span class="fw-bold">$<span id="totalCarrito">0.00</span></span>
            </div>

            <button class="btn btn-outline-danger w-100 mb-2" id="btnVaciarCarrito">Vaciar carrito</button>
            <button class="btn btn-primary w-100" id="btnCheckout">Finalizar compra</button>
        </div>
    </div>
    <script src="./js/storage.js"></script>
    <script src="./js/carrito.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/navBar.js"></script>
    <script src="./js/login.js"></script>
    <script src="./js/footer.js"></script>
</body>

</html>
