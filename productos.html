<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="icon" type="image/x-icon" href="./assets/universalcopy_icon.ico">
</head>

<body>
    <!-- Nav Bar -->
    <header id="navBar"></header>

    <main class="container mb-5">
        <h1 class="mb-4">Productos</h1>

        <!-- Barra filtro -->
        <div class="bg-white rounded-4 p-3 mb-4 shadow-sm">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label mb-1">Buscar producto</label>
                    <input type="text" class="form-control" id="buscadorProductos"
                        placeholder="Playera, taza, gorra...">
                </div>
                <div class="col-md-4">
                    <label class="form-label mb-1">Categoría</label>
                    <select class="form-select" id="filtroCategoria">
                        <option value="todos">Todos</option>
                        <option value="playeras">Playeras</option>
                        <option value="tazas">Tazas</option>
                        <option value="gorras">Gorras</option>
                        <option value="publicidad">Publicidad</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex justify-content-md-end mt-3 mt-md-4">
                    <a href="formCrear.html" class="btn btn-primary">
                        Crear producto personalizado
                    </a>
                </div>
            </div>
        </div>

        <!-- Card container -->
        <div class="row g-3" id="cardContainer">

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/navBar.js"></script>
    <script src="./js/productos.js"></script>
</body>

</html>
