    <!-- Formulario contacto -->
<div class="container mt-5">
    <div class="row justify-content-center">
        
        <!-- Columna izquierda - form -->
        <div class="col-md-6 bg-light p-4 rounded shadow">
            <h2 class="text-center mb-4">Contáctanos</h2>

            <form>
                <div class="mb-3">
                    <label for="inputNombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="inputNombre" placeholder="Primer nombre y apellidó">
                </div>

                <div class="mb-3">
                    <label for="inputCorreo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="inputCorreo" placeholder="correo@example.com">
                </div>

                <div class="mb-3">
                    <label for="inputTelefono" class="form-label">Teléfono</label>
                    <input type="text" class="form-control" id="inputTelefono" placeholder="5500 333 222">
                </div>

                <div class="mb-3">
                    <label for="inputMensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="inputMensaje" rows="3" placeholder="Escribe tu idea o diseño"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar</button>
            </form>
        </div>

        <!-- Columna derecha - Mapa -->
        <div class="col-md-6 bg-light p-4 rounded">
            <h2 class="text-center mb-4">Ubicación</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3760.906060250465!2d-99.133262!3d19.502677!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTnCsDMwJzA5LjYiTiA5OcKwMDcnNTkuNyJX!5e0!3m2!1ses-419!2smx!4v1764109313898!5m2!1ses-419!2smx"

                style="border:0; border-radius:8px;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

    </div>
