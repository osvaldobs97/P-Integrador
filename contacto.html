<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="icon" type="image/x-icon" href="./assets/universalcopy_icon.ico">
</head>


<!--NavBar-->
<header id="navBar"></header>


<body>
    <!-- Formulario contacto -->
    <div class="container mt-5" id="form-container">
        <div class="row justify-content-center">

            <!-- Columna izquierda - form -->
            <div class="col-md-6 p-4 rounded shadow custom-form-bg">
                <h2 class="text-center mb-4">Contáctanos</h2>
                <div class="alert alert-danger fade show" style="display:none;" role="alert" id="alertValidaciones">
                    <p id="alertValidacionesTexto"></p>
                </div>
                <form id="formularioContacto">
                    <div class="mb-3">
                        <label for="inputNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="inputNombre" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="mb-3">
                        <label for="inputCorreo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="inputCorreo" placeholder="correo@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="inputTelefono" class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="inputTelefono" placeholder="5500333222">
                    </div>

                    <div class="mb-3">
                        <label for="inputMensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="inputMensaje" rows="3"
                            placeholder="Platícanos qué necesitas y con gusto te ayudamos."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btnSubmit">Enviar</button>
                    <button type="submit" class="btn btn-primary " id="btnClear">Limpiar todo</button>
                </form>
            </div>

            <!-- Columna derecha - Mapa -->
            <div class="col-md-6 p-4 rounded shadow custom-form-bg">
                <h2 class="text-center mb-4">Ubicación</h2>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3760.906060250465!2d-99.133262!3d19.502677!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTnCsDMwJzA5LjYiTiA5OcKwMDcnNTkuNyJX!5e0!3m2!1ses-419!2smx!4v1764109313898!5m2!1ses-419!2smx"
                    width="100%" height="380" style="border:0; border-radius:8px;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>
    <!-- Footer-->
<script src="./js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="./js/navBar.js"></script>
</body>
