<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniversalCopy Registro</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/componentes.css">
  <link rel="icon" type="image/x-icon" href="./assets/universalcopy_icon.ico">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <header id="navBar"></header>

  <!-- MAIN -->
  <main class="container flex-grow-1 py-5">
    <div class="row g-4 align-items-stretch">

      <!-- COLUMNA IZQUIERDA (desktop) -->
      <div class="col-lg-6 d-none d-lg-block">
        <div class="rounded-4 shadow p-4 h-100 d-flex align-items-center justify-content-center">

          <div class="text-center position-relative w-100">

            <!-- Logo sutil -->
            <img src="./assets/logoUniC.webp"
              alt="UniversalCopy"
              class="position-absolute top-50 start-50 translate-middle opacity-25"
              style="max-width: 220px;" />

            <!-- Contenido -->
            <div class="position-relative z-1">
              <h1 class="mb-5" style="color: whitesmoke;">¡Bienvenido!</h1>

              <div id="keywordsCarousel"
                class="carousel slide carousel-fade mb-5"
                data-bs-ride="carousel"
                data-bs-interval="2600"
                data-bs-pause="false">

                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <h4 class="titulosC">DISEÑA</h4>
                  </div>
                  <div class="carousel-item">
                    <h4 class="titulosC">CREA</h4>
                  </div>
                  <div class="carousel-item">
                    <h4 class="titulosC">IMPRIME</h4>
                  </div>
                </div>
              </div>

              <a href="acercaDe.html" class="btn btn-primary px-4">
                ¡Conócenos!
              </a>
            </div>

          </div>
        </div>
      </div>

      <!-- COLUMNA DERECHA (formulario) -->
      <div class="col-12 col-lg-6">
        <div class="p-4 rounded custom-form-bg h-100">

          <h2 class="text-center mb-4">Regístrate</h2>

          <div class="alert alert-danger" style="display:none;" id="alertValidacionesReg">
            <p id="alertValidacionesTextoReg" class="mb-0"></p>
          </div>

          <form id="formularioRegistro">

            <div class="mb-3">
              <label for="inputNombreReg" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="inputNombreReg" placeholder="Ej. Juan Pérez">
            </div>

            <div class="mb-3">
              <label for="inputTelefonoReg" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="inputTelefonoReg" placeholder="5500333222" maxlength="10"
  inputmode="numeric">
            </div>

            <div class="mb-3">
              <label for="inputCorreoReg" class="form-label">Correo</label>
              <input type="email" class="form-control" id="inputCorreoReg" placeholder="correo@ejemplo.com">
            </div>

            <div class="mb-3">
              <label for="inputContraseñaReg" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="inputContraseñaReg"
                placeholder="Ejemplo1!" required minlength="6">
            </div>

            <div class="mb-3">
              <label for="inputContraseñaReg2" class="form-label">Repite la contraseña</label>
              <input type="password" class="form-control" id="inputContraseñaReg2"
                placeholder="Ejemplo1!" required minlength="6">
            </div>

            <div class="d-grid gap-2 d-sm-flex">
              <button type="submit" class="btn btn-primary" id="btnSubmitReg">Enviar</button>
              <button type="button" class="btn btn-secondary" id="btnClearReg">Limpiar todo</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/navBar.js"></script>
  <script src="./js/registro.js"></script>
  <script src="./js/footer.js"></script>

</body>
</html>
