<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniversalCopy Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="icon" type="image/x-icon" href="./assets/universalcopy_icon.ico">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NavBar -->
    <header id="navBar"></header>

    <!-- MAIN -->
    <main class="container flex-grow-1 py-5">
        <div class="row g-4 ">
            <!-- ESPACIO PARA FOTO -->
            <div class="col-lg-6 d-none d-lg-block ">
                <div class="rounded-4 shadow p-3">
                    <!-- <img src="./assets/logo.webp" alt="Registro UniversalCopy" class="img-fluid rounded-4"
                        style="max-height:420px; object-fit:cover;"> -->
                    <h1 style="color: whitesmoke;">¡Bienvenido!</h1>
                    <h4 style="color: whitesmoke; text-align: left;">Administramos tus pedidos, sube tus diseños y da seguimiento a tus
                        impresiones en UniversalCopy.</h4>
                    <a href="acercaDe.html" class="btn btn-primary ">¡Conócenos!</a>
                </div>
            </div>

            <div class="col-md-6 p-4 rounded custom-form-bg" >
                <h2 class="text-center mb-4">Regístrate</h2>
                <div class="alert alert-danger fade show" style="display:none;" role="alert" id="alertValidacionesReg">
                    <p id="alertValidacionesTextoReg"></p>
                </div>
                <form id="formularioRegistro">
                    <div class="mb-3">
                        <label for="inputNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="inputNombreReg" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="mb-3">
                        <label for="inputTelefono" class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="inputTelefonoReg" placeholder="5500333222">
                    </div>

                    <div class="mb-3">
                        <label for="inputCorreo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="inputCorreoReg" placeholder="correo@example.com">
                    </div>
                    <!-- contraseña -->
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Contraseña</label>
                        <input type="password" id="inputContraseñaReg" class="form-control" placeholder="Ejemplo1!"
                            required minlength="6">
                    </div>
                    <!--repetir contraseña -->
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Repite la contraseña</label>
                        <input type="password" id="inputContraseñaReg2" class="form-control" placeholder="Ejemplo1!"
                            required minlength="6">
                    </div>


                    <button type="submit" class="btn btn-primary" id="btnSubmitReg">Enviar</button>
                    <button type="button" class="btn btn-secondary " id="btnClearReg">Limpiar todo</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer por JS -->
    <script src="./js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/navBar.js"></script>
    <script src="./js/registro.js"></script>
</body>

</html>
