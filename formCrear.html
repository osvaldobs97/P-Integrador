<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="icon" type="image/x-icon" href="./assets/logoSinLetras.ico">
</head>

<body>
    <!-- Nav Bar -->
    <header id="navBar"></header>

    <main class="container my-5">
        <h1 class="mb-4">Añade un producto</h1>
        <!-- Aletras de error-->
        <div id="alertValidacionesContainer"></div>

        <!--Formulario-->
        <div class="form-container" id="formCrear">
            <form id="formProducto" class="p-4 shadow-sm">
                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="inputNombreCrear" class="form-label fw-bold">Nombre del producto</label>
                    <input type="text" id="inputNombreCrear" class="form-control"
                        placeholder="Ej. Playera blanca 100% poliéster">
                </div>

                <!-- PRECIO -->
                <div class="mb-3">
                    <label for="inputPrecioCrear" class="form-label fw-bold">Precio (MXN)</label>
                    <input type="number" id="inputPrecioCrear" class="form-control" min="1.01" max="10000.00"
                        step="0.01" required placeholder="Ej. 199.99">
                </div>

                <!-- DESCRIPCIÓN -->
                <div class="mb-3">
                    <label for="inputDescripcionCrear" class="form-label fw-bold">Descripción</label>
                    <textarea id="inputDescripcionCrear" class="form-control" rows="3"
                        placeholder="Describe el producto..."></textarea>
                </div>

                <!-- IMAGEN -->
                <label for="inputImagenCrear" class="form-label fw-bold">URL Imagen</label>
                <input type="url" id="inputImagenCrear" class="form-control"
                    placeholder="https://ejemplo.com/imagen.webp">
                <!-- BOTÓN -->
                <div class="d-flex flex-column flex-sm-row justify-content-left gap-2 mt-4">
                    <button type="submit" id="btnSubmitCrear" class="btn btn-primary">
                        Crear producto
                    </button>

                    <button type="button" id="btnLimpiar" class="btn btn-secondary">
                        Limpiar todo
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!--CARRITO -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasCarritoLabel">Tu carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">
            <div id="carritoItems" class="d-flex flex-column gap-3"></div>
        </div>

        <div class="p-3 border-top">
            <div class="d-flex justify-content-between mb-2">
                <span class="fw-bold">Total:</span>
                <span class="fw-bold">$<span id="totalCarrito">0.00</span></span>
            </div>

            <button class="btn btn-outline-danger w-100 mb-2" id="btnVaciarCarrito">Vaciar carrito</button>
            <button class="btn btn-primary w-100" id="btnCheckout">Finalizar compra</button>
        </div>
    </div>
    <script src="./js/carrito.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/navBar.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/formCrear.js"></script>
    <script src="./js/main-crear.js"></script>
</body>

</html>
